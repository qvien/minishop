<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">
<title>Mini Shop</title>
<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
rel="stylesheet">
<script
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>
</head>
<body>

<header class="bg-danger text-white p-3">
<div class="container">
<h2 class="text-center">MINI SHOP</h2>
</div>
</header>
<nav class="bg-light p-3">
<div class="container">
<a href="#" class="me-3">Trang chủ</a>
<a href="#sanpham">Sản phẩm</a>
</div>
</nav>
<section class="container mt-4">
<div class="bg-light p-5 text-center rounded">
<h1>Chào mừng đến Mini Shop</h1>
<p>Mua sắm dễ dàng - Giá tốt mỗi ngày</p>
<a href="#sanpham" class="btn btn-danger">
Xem sản phẩm
</a>
</div>
</section>
<section id="sanpham" class="container mt-4">
<h2 class="text-center mb-4">
Sản phẩm nổi bật
</h2>
<div class="row g-3">
<div class="col-12 col-md-6 col-lg-3">
<div class="card h-100">
<img src="./images/ao khoac.jpg"
class="card-img-top"
alt="Áo thun">
<div class="card-body">
<h5 class="card-title">Áo thun</h5>
<p class="text-danger fw-bold">
199.000đ
</p>
<a href="#" class="btn btn-danger">
Mua ngay
</a>
</div>
</div>
</div>
<div class="col-12 col-md-6 col-lg-3">
<div class="card h-100">
<img src="./images/ao somi.jpg"
class="card-img-top"
alt="Áo sơ mi ">
<div class="card-body">
<h5 class="card-title">Áo sơ mi </h5>
<p class="text-danger fw-bold">
299.000đ
</p>
<a href="#" class="btn btn-danger">
Mua ngay
</a>
</div>
</div>
</div>
<div class="col-12 col-md-6 col-lg-3">
<div class="card h-100">
<img src="./images/ao thun.jpg"
class="card-img-top"
alt="Áo khoác ">
<div class="card-body">
<h5 class="card-title">Áo Khoác </h5>
<p class="text-danger fw-bold">
599.000đ
</p>
<a href="#" class="btn btn-danger">
Mua ngay
</a>
</div>
</div>
</div>
<div class="col-12 col-md-6 col-lg-3">
<div class="card h-100">
<img src="./images/quan jean.jpg"
class="card-img-top"
alt="Quần jean ">
<div class="card-body">
<h5 class="card-title">Quần jean </h5>
<p class="text-danger fw-bold">
499.000đ
</p>
<a href="#" class="btn btn-danger">
Mua ngay
</a>
</div>
</div>
</div>
</section>
<footer class="bg-dark text-white text-center p-3 mt-5">
<div class="container">
<p class="mb-0">
© 2026 Mini Shop - Thiết kế bằng Bootstrap 5
</p>
</div>
</footer>
</body>
</html>
